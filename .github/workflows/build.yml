name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download OpenUtau dependencies
        run: |
          mkdir -p libs
          curl -sL https://github.com/stakira/OpenUtau/releases/latest/download/OpenUtau-osx-x64.zip -o openutau.zip
          unzip -q openutau.zip -d openutau_extracted
          cp openutau_extracted/OpenUtau.app/Contents/MacOS/OpenUtau.Core.dll libs/
          cp openutau_extracted/OpenUtau.app/Contents/MacOS/YamlDotNet.dll libs/

      - name: Build Plugin
        run: dotnet build OpenUtau.Plugin.PtBrBrapa.csproj -c Release -o output

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtau.Plugin.PtBrBrapa
          path: output/OpenUtau.Plugin.PtBrBrapa.dll

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/OpenUtau.Plugin.PtBrBrapa.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
